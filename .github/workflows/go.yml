name: Go
on: [push]
jobs:
  test:
    strategy:
      matrix:
        platform:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        go-version:
          - "1.24"
          - "1.25"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
